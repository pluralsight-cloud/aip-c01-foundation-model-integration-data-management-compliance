AWSTemplateFormatVersion: "2010-09-09"
Description: >
  PeakGear Pro Knowledge Base Demo — Foundation Infrastructure
  Covers: S3 bucket, IAM role for validator Lambda, IAM role for
  sync trigger Lambda, and SQS Dead Letter Queue.
  Deploy this template before starting the console steps in Clip 14.

# ================================================================
# PARAMETERS
# ================================================================
Parameters:

  ProjectName:
    Type: String
    Default: peakgear
    Description: >
      Short prefix used for all resource names. Change this if you
      are deploying multiple stacks in the same account.

  Environment:
    Type: String
    Default: demo
    AllowedValues:
      - demo
      - dev
      - prod
    Description: Environment label applied to all resource tags.

# ================================================================
# RESOURCES
# ================================================================
Resources:

  # --------------------------------------------------------------
  # S3 BUCKET — document store for the knowledge base
  # --------------------------------------------------------------
  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-docs-${AWS::AccountId}"
      # Block all public access — Well-Architected Security pillar
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Versioning — allows rollback if a bad document is uploaded
      VersioningConfiguration:
        Status: Enabled
      # Server-side encryption — Well-Architected Security pillar
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      # Lifecycle rule — clean up old versions after 90 days
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
      # NOTE: EventBridge notifications are enabled manually in
      # the console during Clip 14 — this is a teachable moment.
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # Bucket policy — enforce HTTPS only (Well-Architected best practice)
  DocumentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyHTTP
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DocumentsBucket.Arn
              - !Sub "${DocumentsBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": false

  # --------------------------------------------------------------
  # IAM ROLE — Validator Lambda execution role
  # Used by: peakgear-doc-validator Lambda (created in console)
  # --------------------------------------------------------------
  ValidatorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-validator-lambda-role"
      Description: >
        Execution role for the document validator Lambda function.
        Grants read access to S3 and write access to CloudWatch Logs.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Basic Lambda execution — CloudWatch Logs write access
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3ReadPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowS3Read
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:HeadObject
                Resource: !Sub "${DocumentsBucket.Arn}/*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # --------------------------------------------------------------
  # IAM ROLE — Sync Trigger Lambda execution role
  # Used by: peakgear-kb-sync-trigger Lambda (created in console)
  # --------------------------------------------------------------
  SyncTriggerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-sync-trigger-lambda-role"
      Description: >
        Execution role for the KB sync trigger Lambda function.
        Grants access to Bedrock, SQS, Lambda invocation, and
        CloudWatch Logs.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Basic Lambda execution — CloudWatch Logs write access
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockKBSyncPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Allow starting and monitoring ingestion jobs
              - Sid: AllowBedrockIngestion
                Effect: Allow
                Action:
                  - bedrock:StartIngestionJob
                  - bedrock:GetIngestionJob
                  - bedrock:ListIngestionJobs
                  - bedrock:ListDataSources
                Resource: "*"
              # Allow reading from both main queue and DLQ
              # Main queue ARN is constructed from the known queue name
              # since it is created manually in the console
              - Sid: AllowSQSRead
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource:
                  - !GetAtt SyncDLQ.Arn
                  - !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${ProjectName}-sync-queue"
              # Allow invoking the validator Lambda
              - Sid: AllowLambdaInvoke
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-doc-validator"

  # --------------------------------------------------------------
  # SQS DEAD LETTER QUEUE — catches failed sync messages
  # The main sync queue is created manually in the console
  # during Clip 15 — this is a teachable moment.
  # --------------------------------------------------------------
  SyncDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-sync-dlq"
      # Retain failed messages for 7 days for inspection
      MessageRetentionPeriod: 604800
      # Encrypt messages at rest — Well-Architected Security pillar
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

# ================================================================
# OUTPUTS
# ================================================================
# These values are displayed in the CloudFormation console after
# deployment. Copy them before starting the console steps.
Outputs:

  S3BucketName:
    Description: >
      Name of the S3 bucket to upload PeakGear Pro documents to.
      Use this bucket name when creating the Bedrock data source
      in the console during Clip 14.
    Value: !Ref DocumentsBucket
    Export:
      Name: !Sub "${ProjectName}-documents-bucket-name"

  S3BucketArn:
    Description: ARN of the S3 documents bucket.
    Value: !GetAtt DocumentsBucket.Arn
    Export:
      Name: !Sub "${ProjectName}-documents-bucket-arn"

  ValidatorLambdaRoleArn:
    Description: >
      ARN of the IAM role to assign to the peakgear-doc-validator
      Lambda function when creating it in the console during Clip 14.
      In the Lambda console, under Execution role, choose
      "Use an existing role" and paste this ARN.
    Value: !GetAtt ValidatorLambdaRole.Arn
    Export:
      Name: !Sub "${ProjectName}-validator-lambda-role-arn"

  SyncTriggerLambdaRoleArn:
    Description: >
      ARN of the IAM role to assign to the peakgear-kb-sync-trigger
      Lambda function when creating it in the console during Clip 15.
      In the Lambda console, under Execution role, choose
      "Use an existing role" and paste this ARN.
    Value: !GetAtt SyncTriggerLambdaRole.Arn
    Export:
      Name: !Sub "${ProjectName}-sync-trigger-lambda-role-arn"

  SyncDLQArn:
    Description: >
      ARN of the Dead Letter Queue. When creating the main SQS queue
      in the console during Clip 15, paste this ARN into the
      Dead Letter Queue field.
    Value: !GetAtt SyncDLQ.Arn
    Export:
      Name: !Sub "${ProjectName}-sync-dlq-arn"

  SyncDLQUrl:
    Description: URL of the Dead Letter Queue for monitoring.
    Value: !Ref SyncDLQ
    Export:
      Name: !Sub "${ProjectName}-sync-dlq-url"
